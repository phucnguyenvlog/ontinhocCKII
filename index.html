<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Tập Tin Học 7 - Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .question-card {
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        input[type="radio"]:checked + span {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        .correct-answer {
            background-color: #d1fae5 !important;
            border: 2px solid #10b981 !important;
            color: #065f46 !important;
        }

        .wrong-answer {
            background-color: #fee2e2 !important;
            border: 2px solid #ef4444 !important;
            color: #991b1b !important;
        }

        /* Hiệu ứng mượt mà khi hiện nội dung */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- MÀN HÌNH CHỌN CHẾ ĐỘ (WELCOME) -->
    <div id="welcome-screen" class="max-w-2xl mx-auto glass-morphism p-10 text-center mt-20">
        <h1 class="text-4xl font-bold text-gray-800 mb-6">Hệ Thống Ôn Tập Tin Học 7</h1>
        <p class="text-gray-600 mb-8 text-lg">Chào mừng bạn đến với trang web ôn tập. Vui lòng chọn chế độ làm bài để bắt đầu!</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <button onclick="startQuiz('original')" class="p-6 border-2 border-indigo-500 rounded-xl hover:bg-indigo-500 hover:text-white transition-all group">
                <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">📄</div>
                <span class="font-bold text-xl block">Giữ Nguyên Đề</span>
                <span class="text-sm opacity-80 italic">Theo thứ tự từ câu 1 đến 18</span>
            </button>
            <button onclick="startQuiz('shuffle')" class="p-6 border-2 border-purple-500 rounded-xl hover:bg-purple-500 hover:text-white transition-all group">
                <div class="text-3xl mb-2 group-hover:scale-110 transition-transform">🔀</div>
                <span class="font-bold text-xl block">Trộn Đề Ngẫu Nhiên</span>
                <span class="text-sm opacity-80 italic">Thay đổi thứ tự câu hỏi bất kỳ</span>
            </button>
        </div>
    </div>

    <!-- NỘI DUNG CHÍNH (ẨN KHI CHƯA CHỌN) -->
    <div id="quiz-content" class="hidden max-w-4xl mx-auto">
        <div class="glass-morphism p-6 sticky top-4 z-50 mb-8 flex justify-between items-center shadow-lg">
            <div>
                <h2 class="text-2xl font-bold text-indigo-700">Ôn Tập Tin Học 7</h2>
                <p id="mode-text" class="text-sm text-gray-500"></p>
            </div>
            <div class="flex gap-4">
                <button onclick="location.reload()" class="bg-gray-200 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">Quay lại</button>
                <div id="score-float" class="hidden bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold">
                    Điểm: 0/18
                </div>
            </div>
        </div>

        <form id="quiz-form" class="space-y-6 mb-12">
            <div id="questions-list" class="space-y-6">
                <!-- Câu hỏi sẽ được chèn vào đây bởi JS -->
            </div>
            
            <button type="button" onclick="handleSubmit()" id="submit-btn" class="w-full py-5 bg-indigo-600 text-white text-2xl font-bold rounded-2xl shadow-xl hover:bg-indigo-700 transition-colors transform hover:scale-[1.02] active:scale-95">
                Nộp Bài Và Xem Kết Quả
            </button>
        </form>
    </div>

    <!-- MODAL KẾT QUẢ -->
    <div id="result-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center">
            <div id="result-icon" class="text-6xl mb-4">🏆</div>
            <h2 class="text-3xl font-bold mb-2">Kết Quả Bài Làm</h2>
            <div id="result-stats" class="text-5xl font-extrabold text-indigo-600 mb-6">18/18</div>
            <p id="result-message" class="text-gray-600 mb-6 text-lg">Tuyệt vời! Bạn đã hoàn thành bài ôn tập rất tốt.</p>
            <button onclick="location.reload()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold text-lg hover:bg-indigo-700">Làm lại bài mới</button>
        </div>
    </div>

    <script>
        const allQuestions = [
            { id: 1, q: "Để định dạng dữ liệu kiểu ngày tháng trong Excel, ta chọn thẻ nào trong hộp thoại Format Cells?", a: "C", options: { A: "Font", B: "Alignment", C: "Number", D: "Border" } },
            { id: 2, q: "Khi sao chép một ô có chứa công thức với địa chỉ tương đối sang một vị trí khác, địa chỉ sẽ:", a: "D", options: { A: "Giữ nguyên không đổi", B: "Thay đổi tên cột", C: "Chỉ thay đổi tên hàng", D: "Thay đổi tương ứng với vị trí mới" } },
            { id: 3, q: "Trong thiết lập in ấn, tùy chọn 'Landscape Orientation' có ý nghĩa gì?", a: "B", options: { A: "In theo hướng giấy dọc", B: "In theo hướng giấy ngang", C: "In vừa vặn trên một trang", D: "In hai mặt giấy" } },
            { id: 4, q: "Để chỉ in một vùng dữ liệu được chọn trên trang tính, trong mục Settings ta chọn:", a: "C", options: { A: "Print Active Sheets", B: "Print Entire Workbook", C: "Print Selection", D: "Print All Pages" } },
            { id: 5, q: "Để căn giữa bảng dữ liệu trên trang giấy in, ta chọn Custom Margins và chọn ô nào?", a: "A", options: { A: "Horizontally và Vertically", B: "Top và Bottom", C: "Left và Right", D: "Header và Footer" } },
            { id: 6, q: "Hiệu ứng chuyển trang chiếu (Transitions) là:", a: "B", options: { A: "Hiệu ứng xuất hiện cho các đối tượng trong trang", B: "Hiệu ứng chuyển tiếp giữa trang chiếu này sang trang chiếu khác", C: "Hiệu ứng âm thanh khi mở file", D: "Thay đổi màu sắc của trang chiếu" } },
            { id: 7, q: "Để tạo hiệu ứng động cho MỘT ĐỐI TƯỢNG (văn bản, hình ảnh...) trên trang chiếu, ta dùng thẻ:", a: "C", options: { A: "Transitions", B: "Design", C: "Animations", D: "Slide Show" } },
            { id: 8, q: "Để thay đổi mẫu định dạng (Theme) cho bài trình chiếu, ta vào dải lệnh:", a: "C", options: { A: "Insert", B: "Home", C: "Design", D: "Review" } },
            { id: 9, q: "Điểm khác biệt cơ bản giữa hiệu ứng Transition và Animation là gì?", a: "B", options: { A: "Transition chỉ dùng cho hình ảnh", B: "Transition áp dụng cho trang chiếu, Animation áp dụng cho đối tượng", C: "Animation áp dụng cho trang chiếu, Transition áp dụng cho đối tượng", D: "Không có sự khác biệt" } },
            { id: 10, q: "Trong dải lệnh Animations, nhóm lệnh nào quy định cách đối tượng 'biến mất'?", a: "C", options: { A: "Entrance", B: "Emphasis", C: "Exit", D: "Motion Paths" } },
            { id: 11, q: "Phím tắt để bắt đầu trình chiếu từ trang đầu tiên là:", a: "A", options: { A: "F5", B: "Shift + F5", C: "Ctrl + P", D: "Alt + F5" } },
            { id: 12, q: "Thuật toán tìm kiếm nhị phân yêu cầu danh sách đầu vào phải:", a: "B", options: { A: "Chưa sắp xếp", B: "Đã được sắp xếp", C: "Chỉ chứa số", D: "Có ít hơn 10 phần tử" } },
            { id: 13, q: "Danh sách [1, 3, 5, 6, 10]. Tìm giá trị 6 bằng tìm kiếm nhị phân mất mấy bước so sánh?", a: "A", options: { A: "2 bước", B: "3 bước", C: "4 bước", D: "5 bước" } },
            { id: 14, q: "Ưu điểm lớn nhất của tìm kiếm nhị phân so với tìm kiếm tuần tự là:", a: "C", options: { A: "Dễ thực hiện hơn", B: "Tìm được nhiều giá trị cùng lúc", C: "Tìm kiếm nhanh hơn rất nhiều với danh sách lớn", D: "Không cần sắp xếp" } },
            { id: 15, q: "Với danh sách đã sắp xếp có 8 phần tử, số lần so sánh tối đa của thuật toán nhị phân là:", a: "B", options: { A: "3 lần", B: "4 lần", C: "8 lần", D: "2 lần" } },
            // Các câu 16, 17, 18 đã thêm đáp án A B C D theo yêu cầu
            { id: 16, q: "Trong PowerPoint, em mở dải lệnh nào để hiển thị các mẫu định dạng (Themes)?", a: "C", options: { A: "Home", B: "Insert", C: "Design", D: "Animations" } },
            { id: 17, q: "Mỗi bước thực hiện tìm kiếm nhị phân, thuật toán sẽ loại bỏ bao nhiêu phần tử?", a: "B", options: { A: "1 phần tử", B: "Một nửa số phần tử trong vùng đang xét", C: "Toàn bộ danh sách", D: "Loại bỏ phần tử lớn nhất" } },
            { id: 18, q: "Cho danh sách tên [Hoa, Lan, Ly, Mai, Phong, Vi]. Cần mấy bước để tìm thấy tên 'Mai' bằng tìm kiếm nhị phân?", a: "C", options: { A: "1 bước", B: "2 bước", C: "3 bước", D: "4 bước" } }
        ];

        function startQuiz(mode) {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-content').classList.remove('hidden');
            document.getElementById('mode-text').innerText = mode === 'original' ? 'Chế độ: Giữ nguyên đề gốc' : 'Chế độ: Trộn đề ngẫu nhiên';
            
            let displayList = [...allQuestions];
            if (mode === 'shuffle') {
                displayList.sort(() => Math.random() - 0.5);
            }
            
            renderQuestions(displayList);
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questions-list');
            container.innerHTML = '';
            
            questions.forEach((q, index) => {
                const div = document.createElement('div');
                div.className = 'question-card glass-morphism p-6 fade-in';
                div.setAttribute('data-id', q.id);
                
                let optionsHtml = '';
                for (let key in q.options) {
                    optionsHtml += `
                        <label class="flex items-center space-x-3 p-3 rounded-lg border border-gray-200 cursor-pointer hover:bg-indigo-50 transition-colors">
                            <input type="radio" name="q${q.id}" value="${key}" class="w-5 h-5 text-indigo-600">
                            <span class="text-gray-700 font-medium">${key}. ${q.options[key]}</span>
                        </label>
                    `;
                }

                div.innerHTML = `
                    <p class="text-lg font-bold text-indigo-900 mb-4">Câu ${index + 1}: ${q.q}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function handleSubmit() {
            let score = 0;
            const form = document.getElementById('quiz-form');
            
            allQuestions.forEach(q => {
                const selected = form.querySelector(`input[name="q${q.id}"]:checked`);
                const questionBlock = form.querySelector(`div[data-id="${q.id}"]`);
                const allLabels = questionBlock.querySelectorAll('label');

                // Xóa màu cũ
                allLabels.forEach(l => {
                    l.classList.remove('correct-answer', 'wrong-answer');
                    l.style.pointerEvents = 'none'; // Khóa không cho chọn lại
                });

                if (selected) {
                    if (selected.value === q.a) {
                        score++;
                        selected.parentElement.classList.add('correct-answer');
                    } else {
                        selected.parentElement.classList.add('wrong-answer');
                        // Hiển thị đáp án đúng
                        allLabels.forEach(l => {
                            if (l.querySelector('input').value === q.a) {
                                l.classList.add('correct-answer');
                            }
                        });
                    }
                } else {
                    // Nếu không chọn, vẫn hiện đáp án đúng
                    allLabels.forEach(l => {
                        if (l.querySelector('input').value === q.a) {
                            l.classList.add('correct-answer');
                        }
                    });
                }
            });

            // Hiển thị kết quả
            document.getElementById('score-float').innerText = `Điểm: ${score}/18`;
            document.getElementById('score-float').classList.remove('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
            
            // Hiện Modal
            document.getElementById('result-modal').classList.remove('hidden');
            document.getElementById('result-stats').innerText = `${score}/18`;
            
            if(score < 9) {
                document.getElementById('result-icon').innerText = '😕';
                document.getElementById('result-message').innerText = 'Cần cố gắng hơn bạn nhé! Hãy xem lại các đáp án đúng.';
            } else if(score < 15) {
                document.getElementById('result-icon').innerText = '🙂';
                document.getElementById('result-message').innerText = 'Khá tốt! Bạn đã nắm được kiến thức cơ bản.';
            } else {
                document.getElementById('result-icon').innerText = '🏆';
                document.getElementById('result-message').innerText = 'Tuyệt vời! Bạn đã hoàn thành bài ôn tập rất xuất sắc.';
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
